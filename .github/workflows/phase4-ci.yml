name: Phase 4 — Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no lockfile exists yet)
        run: npm install --no-audit --no-fund
      - name: Check content and assets
        run: npm run test:content
      - name: Test CMS rules
        run: npm run test:cms
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js for production
        run: npm run build
      - name: Smoke-test the built site without credentials
        run: node scripts/ci-smoke.mjs

  integration:
    name: PostgreSQL and mocked email API integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only-password
          POSTGRES_DB: portfolio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CI_DATABASE_URL: postgresql://postgres:local-ci-only-password@127.0.0.1:5432/portfolio_ci
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production application
        run: npm run build
      - name: Run isolated CMS integration tests
        run: node scripts/ci-cms-integration.mjs

  browser:
    name: Real browser desktop/mobile checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install test-only Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Build Next.js for production
        run: npm run build
      - name: Verify desktop and mobile interactions
        run: node scripts/ci-browser-check.mjs
