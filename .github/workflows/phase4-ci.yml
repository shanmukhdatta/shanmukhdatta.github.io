name: Phase 4 — Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no lockfile exists yet)
        run: npm install --no-audit --no-fund
      - name: Check content and assets
        run: npm run test:content
      - name: Test CMS rules
        run: npm run test:cms
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js for production
        run: npm run build
      - name: Smoke-test the built site without credentials
        run: node scripts/ci-smoke.mjs